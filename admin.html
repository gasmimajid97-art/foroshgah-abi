<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | فروشگاه آبی</title>
<style>body{font-family:Tahoma,Arial;background:#f3f7fb;color:#17283b;margin:0;line-height:1.8}header{background:#0b2440;color:#fff;padding:18px}main{max-width:850px;margin:20px auto;padding:0 14px}.box{background:#fff;border:1px solid #e0eaf3;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #d5e1ec;border-radius:8px;box-sizing:border-box;font:inherit}textarea{min-height:70px}.wide{grid-column:1/-1}button{border:0;padding:10px 14px;border-radius:9px;cursor:pointer;font:inherit;background:#1268b3;color:white}.secondary{background:#eaf3fb;color:#174b76}.danger{background:#fff0ef;color:#a32d25}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #e5edf5;padding:12px 0}.row small{display:block;color:#718398}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.note{background:#eaf5ff;border-radius:10px;padding:12px;font-size:13px}#panel{display:none}@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{align-items:flex-start;flex-direction:column}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script></head><body>
<header><h2>پنل مدیریت فروشگاه آبی</h2><small>مدیریت محصولات فروشگاه</small></header><main>
<section class="box" id="loginBox"><h3>ورود مدیر</h3><p class="note">با ایمیل و رمز عبوری که در Firebase Authentication ساخته‌اید وارد شوید.</p><form id="loginForm"><label>ایمیل مدیر</label><input id="email" type="email" required autocomplete="username"><br><br><label>رمز عبور</label><input id="password" type="password" required autocomplete="current-password"><div class="actions"><button type="submit">ورود به پنل</button></div></form><p id="loginMsg" role="status"></p></section>
<div id="panel"><section class="box"><div class="actions" style="justify-content:space-between"><h3>افزودن یا ویرایش محصول</h3><button class="secondary" id="logout">خروج از حساب</button></div><form id="form"><input type="hidden" id="key"><div class="grid"><div><label>نام محصول *</label><input id="name" required></div><div><label>دسته خودرو</label><select id="car"><option>نیسان</option><option>پراید</option><option>پژو</option><option>مزدا</option><option>پراید و پژو</option></select></div><div><label>آیکون</label><input id="icon" value="🔧"></div><div><label>قیمت (عدد؛ خالی = استعلام)</label><input id="price" type="number" min="0"></div><div class="wide"><label>توضیحات</label><textarea id="desc"></textarea></div></div><div class="actions"><button type="submit">ذخیره در فروشگاه</button><button type="button" class="secondary" id="clear">پاک‌کردن فرم</button></div></form></section>
<section class="box"><h3>فهرست محصولات <span id="count"></span></h3><div id="list">در حال بارگذاری...</div></section></div>
<p><a href="./">بازگشت به فروشگاه</a></p></main>
<script>
const firebaseConfig={apiKey:"AIzaSyAKgHTC2-HaESmdrsQMgBuUsq3QQcptO6E",authDomain:"foroshgah-abi.firebaseapp.com",databaseURL:"https://foroshgah-abi-default-rtdb.firebaseio.com",projectId:"foroshgah-abi",storageBucket:"foroshgah-abi.firebasestorage.app",messagingSenderId:"492765979499",appId:"1:492765979499:web:b890ab658e9b722b01e22e",measurementId:"G-TVRVN6BYWB"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let items={};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
auth.onAuthStateChanged(user=>{const ok=!!user;$('loginBox').style.display=ok?'none':'block';$('panel').style.display=ok?'block':'none';if(ok){db.ref('products').on('value',snap=>{items=snap.val()||{};render()});}});
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='در حال ورود...';try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);$('loginMsg').textContent='';}catch(err){$('loginMsg').textContent='ورود ناموفق بود. ایمیل و رمز عبور را بررسی کنید.';}};
$('logout').onclick=()=>auth.signOut();function clearForm(){$('form').reset();$('key').value='';$('icon').value='🔧'}$('clear').onclick=clearForm;
$('form').onsubmit=async e=>{e.preventDefault();const p={name:$('name').value.trim(),car:$('car').value,icon:$('icon').value.trim()||'🔧',price:$('price').value?Number($('price').value):null,desc:$('desc').value.trim(),stock:true};if(!p.name)return;try{const k=$('key').value||db.ref('products').push().key;await db.ref('products/'+k).set(p);clearForm();alert('محصول در فروشگاه ذخیره شد.');}catch(err){alert('ذخیره انجام نشد؛ قوانین دیتابیس و حساب مدیر را بررسی کنید.');}};
function render(){$('count').textContent='('+Object.keys(items).length+' کالا)';$('list').innerHTML=Object.entries(items).map(([k,p])=>`<div class="row"><div><b>${esc(p.name)}</b><small>${esc(p.car)} · ${p.price?Number(p.price).toLocaleString('fa-IR')+' تومان':'استعلام قیمت'}</small></div><div class="actions"><button class="secondary" onclick="editItem('${k}')">ویرایش</button><button class="danger" onclick="deleteItem('${k}')">حذف</button></div></div>`).join('')||'هنوز محصولی ثبت نشده است.';}
window.editItem=k=>{const p=items[k];if(!p)return;$('key').value=k;$('name').value=p.name||'';$('car').value=p.car||'نیسان';$('icon').value=p.icon||'🔧';$('price').value=p.price||'';$('desc').value=p.desc||'';scrollTo({top:0,behavior:'smooth'});};window.deleteItem=async k=>{if(confirm('این محصول حذف شود؟'))try{await db.ref('products/'+k).remove()}catch(e){alert('حذف انجام نشد؛ دسترسی مدیر را بررسی کنید.')}};
</script></body></html>
